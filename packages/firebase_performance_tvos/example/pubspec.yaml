name: firebase_performance_example
description: Demonstrates how to use the firebase_performance plugin on tvOS.
publish_to: none

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  # Exact pins: firebase_core and firebase_core_tvos must move together.
  firebase_core: 4.11.0
  firebase_performance: 0.11.4+3
  firebase_performance_tvos:
    path: ../
  firebase_core_tvos: ^0.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
