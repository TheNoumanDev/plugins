name: cloud_functions_example
description: Demonstrates how to use the cloud_functions plugin on tvOS.
publish_to: none

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  # Exact pins: firebase_core and firebase_core_tvos must move together.
  cloud_functions: 6.3.3
  cloud_functions_tvos:
    path: ../
  firebase_core: 4.11.0
  firebase_core_tvos: ^0.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
