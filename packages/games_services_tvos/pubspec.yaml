name: games_services_tvos
description: "tvOS (Apple TV) implementation of the games_services Flutter plugin, provided by flutter-tvos."
version: 0.0.1
homepage: https://fluttertv.dev
repository: https://github.com/fluttertv/plugins/tree/main/packages/games_services_tvos
issue_tracker: https://github.com/fluttertv/plugins/issues
# Generated by `flutter-tvos plugin port`. See PORTING_REPORT.md.
# License holder: The FlutterTV Authors

environment:
  # The house floor. This package ships no Dart of its own beyond a
  # documentation-only library, so it imposes nothing; whichever
  # games_services the app picks brings its own constraint.
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  # The Swift was ported from games_services 5.3.0, but it answers 4.x as
  # well, and the range says so rather than forcing an upgrade on apps that
  # are still on 4.x (games_services_watchos pins ^4.1.1, so a narrower
  # range here would make the wrist and the TV unable to coexist).
  #
  # Checked rather than assumed, because getting it wrong is a runtime
  # MissingPluginException rather than a resolution error:
  #   - same channel name, `games_services`, in both interface versions
  #   - 5.3.0's Method enum is a strict superset of 4.1.1's, adding only
  #     loadPreviousOccurrence and fetchIdentityVerificationSignature
  #   - every argument key 4.1.1 sends is read, unchanged, by the 5.3.0
  #     handlers -- the sole addition is `ignoreImages`, which a 4.x client
  #     never sends and which defaults to `false`, i.e. 4.x's behaviour
  games_services_platform_interface: ">=4.1.1 <6.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      tvos:
        pluginClass: SwiftGamesServicesPlugin
