name: firebase_crashlytics_example
description: Demonstrates how to use the firebase_crashlytics plugin on tvOS.
publish_to: none

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  # firebase_core is pinned exact; its train picks the matching firebase_core_tvos
  # (4.14.x -> pi 8.1.1 -> 0.0.3); floating it breaks the native Pigeon ABI.
  firebase_core: 4.14.0
  firebase_crashlytics: 5.3.0
  firebase_crashlytics_tvos:
    path: ../
  firebase_core_tvos: ^0.0.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
