name: firebase_crashlytics_tvos
description: >-
  tvOS (Apple TV) implementation of the firebase_crashlytics Flutter plugin,
  providing Firebase Crashlytics crash reporting on Apple TV.
version: 0.0.2
homepage: https://fluttertv.dev
repository: https://github.com/fluttertv/plugins/tree/main/packages/firebase_crashlytics_tvos
issue_tracker: https://github.com/fluttertv/plugins/issues
# Generated by `flutter-tvos plugin port`, then finished by hand. See PORTING_REPORT.md.
# License holder: fluttertv

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  # tvos/Classes/*.g.swift is generated against 5.3.0. 5.4.0 ships the same
  # native sources apart from versionNumber. 6.0.0 needs firebase_core 5.x,
  # which firebase_core_tvos doesn't support yet.
  firebase_crashlytics: ^5.3.0
  # Transitive Dart dependency so the app's dependency graph includes
  # firebase_core_tvos — plugin discovery (tvos_plugins.dart) only adds a
  # package's native pod to the generated Podfile if it's reachable here,
  # which the podspec's `s.dependency 'firebase_core_tvos'` then resolves
  # instead of failing over to upstream's iOS-only firebase_core pod.
  # 0.0.3+ matches the platform interface 8.1.1 that 5.3.0 needs.
  firebase_core_tvos: ^0.0.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      tvos:
        pluginClass: FirebaseCrashlyticsPlugin
