name: firebase_ai_example
description: Demonstrates how to use the firebase_ai plugin on tvOS.
publish_to: none

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  # firebase_core is pinned exact; its train picks the matching firebase_core_tvos
  # (4.11.x -> pi 7.1.0 -> 0.0.2); floating it breaks the native Pigeon ABI.
  firebase_ai: 3.13.1
  firebase_ai_tvos:
    path: ../
  firebase_core: 4.11.0
  firebase_core_tvos: ^0.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
