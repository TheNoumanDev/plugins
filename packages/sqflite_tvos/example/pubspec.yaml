name: sqflite_example
description: Demonstrates how to use the sqflite plugin and perform some tests.
publish_to: none
version: '0.4.0'

environment:
  sdk: ^3.10.0

dependencies:
  sqflite: ^2.4.2+1
  sqflite_tvos:
    path: ../
  path: any
  collection: any
  flutter:
    sdk: flutter
  sqflite_common:
  synchronized:
  matcher:
  meta:
  sqflite_example_common:
    git:
      url: https://github.com/tekartik/sqflite
      path: packages_flutter/sqflite_example_common
      # Last commit before it moved to Dart ^3.13, above CI's Flutter.
      ref: aaabf90828645125bf7f4bd8e9a6fe4e3935b076
dev_dependencies:
  flutter_lints: ">=5.0.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test:
  process_run: '>=0.11.0+2'
  pub_semver: 

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the Icons class.
  uses-material-design: true
